{% extends "base.html" %}

{% block title %}Recover Password - AI Job Copilot{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="card card-custom p-4">
      <div class="text-center mb-4">
        <i class="bi bi-key-fill text-warning display-4"></i>
        <h3 class="fw-bold text-white mt-2">Password Recovery</h3>
        <p class="text-secondary small">Enter your email address to receive password recovery instructions</p>
      </div>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-4">
          <label class="form-label text-light">Email Address</label>
          <input type="email" name="email" class="form-control form-control-dark" placeholder="you@domain.com" required>
        </div>

        <button type="submit" class="btn btn-warning w-100 py-2 fw-semibold">
          Send Recovery Link
        </button>
      </form>

      <div class="text-center text-secondary small mt-4">
        Remember your password?
        <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
