{% extends "base.html" %}

{% block title %}Sign in with Google - AI Job Copilot{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="card card-custom p-4 border border-secondary shadow-lg">
      <!-- Google Branding Header -->
      <div class="text-center mb-4">
        <svg width="40" height="40" viewBox="0 0 24 24" class="mb-2">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <h4 class="fw-bold text-white mb-1">Choose a Google Account</h4>
        <p class="text-secondary small">to continue to <strong class="text-light">AI JobAgent Studio</strong></p>
      </div>

      <!-- Account 1: Quick Candidate Profile -->
      <form method="POST" action="{{ url_for('auth.google_auth') }}" class="mb-3">
        <input type="hidden" name="email" value="vishnubeere91@gmail.com">
        <input type="hidden" name="name" value="Beere Vishnu Sai">
        <button type="submit" class="btn btn-outline-light w-100 p-3 text-start d-flex align-items-center gap-3 border-secondary rounded-3" style="background-color: rgba(255, 255, 255, 0.03); transition: all 0.2s ease;">
          <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold fs-5 shadow-sm" style="width: 44px; height: 44px; flex-shrink: 0;">
            V
          </div>
          <div class="overflow-hidden">
            <div class="fw-semibold text-white text-truncate">Beere Vishnu Sai</div>
            <div class="text-secondary small text-truncate">vishnubeere91@gmail.com</div>
          </div>
          <i class="bi bi-arrow-right ms-auto text-secondary"></i>
        </button>
      </form>

      <!-- Account 2: Or Custom Google Account -->
      <div class="border-top border-secondary pt-3 mt-2">
        <p class="text-secondary small mb-2"><i class="bi bi-person-plus me-1 text-primary"></i> Or sign in with another Gmail account:</p>
        <form method="POST" action="{{ url_for('auth.google_auth') }}">
          <div class="mb-2">
            <input type="email" name="email" class="form-control form-control-dark" placeholder="yourname@gmail.com" required>
          </div>
          <div class="mb-3">
            <input type="text" name="name" class="form-control form-control-dark" placeholder="Your Display Name (Optional)">
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
            Continue with this Gmail
          </button>
        </form>
      </div>

      <div class="text-center mt-4">
        <a href="{{ url_for('auth.login') }}" class="text-secondary text-decoration-none small">
          <i class="bi bi-arrow-left me-1"></i> Back to Standard Sign In
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
