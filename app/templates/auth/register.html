{% extends "base.html" %}

{% block title %}Register - AI Job Copilot{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-5">
    <div class="card card-custom p-4">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus-fill text-primary display-4"></i>
        <h3 class="fw-bold text-white mt-2">Create Account</h3>
        <p class="text-secondary small">Start managing your career with intelligence</p>
      </div>

      <!-- Google Sign Up Button -->
      <a href="{{ url_for('auth.google_auth') }}" class="btn btn-light w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3 shadow-sm text-dark border">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Sign up with Google</span>
      </a>

      <!-- Divider -->
      <div class="d-flex align-items-center my-3">
        <hr class="flex-grow-1 border-secondary">
        <span class="px-2 text-secondary small text-uppercase" style="font-size: 0.72rem; letter-spacing: 0.5px;">or with email</span>
        <hr class="flex-grow-1 border-secondary">
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <div class="mb-3">
          <label class="form-label text-light">Full Name</label>
          <input type="text" name="full_name" class="form-control form-control-dark" placeholder="e.g. Vishnu Sai" required>
        </div>

        <div class="mb-3">
          <label class="form-label text-light">Email Address</label>
          <input type="email" name="email" class="form-control form-control-dark" placeholder="you@domain.com" required>
        </div>

        <div class="mb-4">
          <label class="form-label text-light">Password</label>
          <input type="password" name="password" class="form-control form-control-dark" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          Create Free Account
        </button>
      </form>

      <div class="text-center text-secondary small mt-4">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-primary text-decoration-none">Sign In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
