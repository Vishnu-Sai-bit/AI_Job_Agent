[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-copilot"
version = "2.0.0"
description = "AI Job Copilot & Career Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Beere Vishnu Sai", email = "beerevishnusai776600@gmail.com" }
]
dependencies = [
    "flask>=3.0.0",
    "flask-sqlalchemy>=3.1.0",
    "flask-login>=0.6.3",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "pymupdf>=1.23.0",
    "python-docx>=1.1.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]
